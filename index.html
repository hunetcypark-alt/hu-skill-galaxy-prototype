<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HU 스킬 갤럭시 · 탐색형 시안</title>
<style>
:root{--bg:#000;--card:#0c0c0e;--bd:#2a2a2f;--bd2:#3a3a41;--ink:#ececee;--ink2:#a0a0a8;--ink3:#6c6c75;--panel:#0c0c0e;
  --skill:#ffc342;--content:#f66570;--career:#3182f6;--holo:linear-gradient(120deg,#7c5cff,#27d3ff,#ff5fcf,#ffb86b,#7c5cff);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{-webkit-user-select:none;user-select:none;position:fixed;inset:0;background:#000;overflow:hidden;cursor:grab;touch-action:none;perspective:1400px;perspective-origin:50% 50%}
.stage.drag{cursor:grabbing}
#amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#amb i{position:absolute;border-radius:50%;opacity:.9}
#amb i:nth-child(1){right:-8%;top:-20%;width:52vw;height:52vw;background:radial-gradient(circle,rgba(160,115,255,.2),transparent 64%)}
#amb i:nth-child(2){left:-10%;bottom:-22%;width:44vw;height:44vw;background:radial-gradient(circle,rgba(40,190,255,.07),transparent 65%);}
#amb i:nth-child(3){left:38%;top:30%;width:30vw;height:30vw;background:radial-gradient(circle,rgba(255,120,200,.03),transparent 65%);}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,3vh) scale(1.12)}}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cvE{z-index:1}
#cvP{z-index:3}
#tiles{position:absolute;inset:0;z-index:2}
#bglow{position:absolute;left:50%;bottom:-22vh;width:76vw;height:44vh;transform:translateX(-50%);z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(150,120,255,.13),rgba(80,160,255,.04) 45%,transparent 72%)}
#vg{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse 46% 56% at var(--vx,50%) 50%,rgba(255,255,255,.035),transparent 70%),radial-gradient(ellipse 78% 82% at var(--vx,50%) 50%,transparent 30%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.94) 100%);transition:background .3s}
.cd.X{width:176px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:#cfcfcf;background:rgba(40,40,44,.7)}
.cd.X span{color:#fff;font-weight:700}
.cd.X{flex-direction:row!important;flex-wrap:nowrap!important;white-space:nowrap;padding:0 18px!important}.cd.X em{font-style:normal;display:block}.cd.X::before{display:none}
.cd.X i{width:8px;height:8px;border-radius:50%;flex:none}
.intro .cd{transition:width .4s cubic-bezier(.16,1,.3,1),height .4s cubic-bezier(.16,1,.3,1),transform .22s ease,background .22s,box-shadow .22s!important}
body.intro .cd{overflow:hidden}
body.intro .tl:not(.ctr) .cd .t,body.intro .tl:not(.ctr) .cd .sb,body.intro .tl:not(.ctr) .cd .mc{white-space:nowrap;animation:txin .3s ease .16s both}
@keyframes txin{from{opacity:0}to{opacity:1}}
body.intro .tl.new .in{animation-duration:.18s!important;animation-delay:0s!important}
body.intro .tl[data-lod="3"] .cd{animation:tw 1.7s ease-in-out infinite}
body.intro .tl:nth-child(3n) .cd{animation-delay:-.5s}body.intro .tl:nth-child(3n+1) .cd{animation-delay:-1.1s}
@keyframes tw{0%,100%{filter:brightness(.85)}50%{filter:brightness(1.9)}}
.tl .cd{animation:bob 6.4s ease-in-out infinite}
.tl:nth-child(3n) .cd{animation-duration:7.8s;animation-delay:-2s}.tl:nth-child(3n+1) .cd{animation-duration:5.6s;animation-delay:-3.4s}.tl:nth-child(5n) .cd{animation-duration:8.6s;animation-delay:-5s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -1px}}
@media (prefers-reduced-motion:reduce){.tl .cd{animation:none!important}}
.tl.pc .cd{box-shadow:inset 0 0 0 1px rgba(255,233,168,.85),0 0 18px -8px rgba(255,233,168,.45)!important}
.cir#bLines.off{opacity:.55}.cir#bLines.off::after{content:'';position:absolute;width:20px;height:1.6px;background:#e8e8ea;transform:rotate(-45deg);border-radius:1px}.cir#bLines{position:relative}
body.frz #tiles{pointer-events:none}
body.lock .stage,body.lock .top,body.lock .nav,body.lock .bl,body.lock .br,body.lock .lgc,body.lock .lp,body.lock .spb,body.lock #recent,body.lock #banner{pointer-events:none!important}
body.lock .top *,body.lock .nav *,body.lock .bl *,body.lock .br *,body.lock .lgc *,body.lock .lp *,body.lock .spb *,body.lock #recent *{pointer-events:none!important}
body.spot .tl:hover .cd{transform:none!important}
body.spot .tl:hover .cd .gl,body.spot .tl:hover .cd .rg{opacity:0!important}
body.spot .tl:not(.ux):not(.sel):not(.pc):hover .cd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.085),0 10px 26px rgba(0,0,0,.4)!important}
body.spot .tl:not(.ux):not(.sel):not(.pc):hover .cd .gl,body.spot .tl:not(.ux):not(.sel):not(.pc):hover .cd .rg{opacity:0!important}
.lgc{position:absolute;right:18px;bottom:68px;z-index:5;width:224px;border-radius:18px;background:#151517;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 12px 30px rgba(0,0,0,.55);overflow:hidden}
.pnl .lgc:not(.closed){right:122px;bottom:22px;z-index:20}   /* 상세 패널이 열려 있어도, 펼치면 알약이 있던 자리에서 위로 패널 위에 가장 위에 나타난다 */
.lgh{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 14px;border:0;background:transparent;color:#e2e2e6;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.lgh span{flex:1}
.lgh svg{width:17px;height:17px;fill:none;stroke:#9a9aa2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lgh .chv{transition:transform .2s}.lgc.closed .lgh .chv{transform:rotate(180deg)}
.lgb{padding:2px 16px 14px;display:grid;gap:14px;border-top:1px solid rgba(255,255,255,.06);margin-top:0;padding-top:12px}.lgc.closed .lgb{display:none}
.lgc.closed{width:var(--zw,164px);border-radius:999px;bottom:64px}
.lgc.closed .lgh{height:34px;padding:0 12px;gap:6px}
.lgc.closed .lgh .inf{display:none}.lgc.closed .lgh span{text-align:center}
.pnl .lgc.closed{right:122px;bottom:22px}   /* 상세 패널이 열렸을 때: 접힌 알약은 확대/축소 컨트롤 바로 왼쪽(같은 줄)에 둔다 */
.gs{display:grid;gap:7px}
.gs b{font-size:11.5px;font-weight:600;color:#8a8a92;letter-spacing:.02em}
.lgb .lr{display:flex;align-items:center;gap:12px;font-size:12.5px;color:#c4c4ca}
.lgb .lr i{display:block;width:36px;border-radius:2px;background:#c8c8d0}
.lgb .lr i.p{height:2px;background:#ffe9a8}
.lgb p{margin:0;font-size:12px;line-height:1.5;color:#a2a2aa}
@media (max-width:760px){.lgc{display:none}}
.vseg{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:6;display:flex;padding:3px;border-radius:999px;background:rgba(10,10,12,.82);box-shadow:inset 0 0 0 1px var(--bd)}
.vseg button{padding:0 14px;height:28px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}
.vseg button.on{background:#fff;color:#0b0b0d}
.nl{display:none}
.bgs{display:none}
body.vnode .tl[data-lod="3"] .bgs{display:block}
/* 노드형: 카드 대신 도형 아이콘 노드 + 이름 라벨. 선택한 카드만 카드로 열린다 */
body.vnode .tl[data-lod="3"] .cd{background:transparent!important;box-shadow:none!important;overflow:visible}
body.vnode .tl[data-lod="3"] .cd .ic{width:38px;height:38px}
body.vnode .tl[data-lod="3"] .cd .ic svg{width:38px;height:38px;filter:drop-shadow(0 0 8px rgba(255,255,255,.22))}
body.vnode .tl[data-lod="3"] .nl{display:block;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;padding:3px 9px 4px;border-radius:8px;background:rgba(8,8,10,.86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-size:11.5px;font-weight:500;color:#dcdce2;white-space:nowrap;max-width:172px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.vnode .tl[data-lod="3"]:hover .cd,body.vnode .tl.ux[data-lod="3"] .cd,body.vnode .tl.pc[data-lod="3"] .cd{box-shadow:none!important}
body.vnode .tl.ux[data-lod="3"] .cd .ic svg,body.vnode .tl.pc[data-lod="3"] .cd .ic svg{filter:drop-shadow(0 0 10px rgba(255,255,255,.7))}
body.vnode .tl.pc[data-lod="3"] .cd .ic svg{filter:drop-shadow(0 0 10px rgba(255,233,168,.8))}
@media (max-width:760px){.vseg{top:60px}}
/* 노드형 선택: 곰발바닥 — 카드형과 같은 평평한 어두운 면 + 얇은 선, 색은 아이콘에만 */
.cd.P{margin-top:-27px;position:relative;display:block!important;padding:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
.tl.sel .cd.P,.tl.sel .cd.P.E,.cd.P.E,.tl.ux .cd.P,.tl.pc .cd.P{background:transparent!important;box-shadow:none!important}
.cd.P .gl,.cd.P .rg{display:none!important}
.pw-ring2{position:absolute;left:50%;top:125px;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.12);pointer-events:none}
.pw-core{position:absolute;left:50%;top:125px;width:112px;height:112px;margin:-56px 0 0 -56px;display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45))}
.pw-svg{width:100%;height:100%;display:block;overflow:visible}
.pw-btn{position:absolute;left:50%;top:125px;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#1f1f22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);display:grid;place-items:center;transform:translate(var(--x),var(--y));transition:background .15s}
.pw-btn:hover{background:#2a2a2e}
.pw-btn svg{width:16px;height:16px}
.pw-btn em{position:absolute;right:-6px;bottom:-6px;min-width:17px;box-sizing:border-box;height:17px;padding:0 4px;border-radius:9px;background:#111113;color:#d6d6da;font-family:inherit;font-size:10.5px;font-weight:600;line-height:17px;font-style:normal;text-align:center;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.pw-btn.on{box-shadow:inset 0 0 0 1.5px var(--dc)}
.pw-name{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);padding:5px 13px 6px;border-radius:10px;background:rgba(8,8,10,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:grid;gap:1px;text-align:center;white-space:nowrap;pointer-events:none}
.pw-name b{font-size:13.5px;font-weight:600;color:#f1f1f3}
.pw-name small{font-size:10.5px;color:#8c8c92}
body.vnode .tl.ctr[data-lod="3"] .cd .ic svg{filter:drop-shadow(0 0 14px rgba(255,255,255,.28))}   /* 밝기 필터를 쓰면 바닥 면까지 회색으로 떠올라 배경이 보인다 — 아이콘만 따로 밝힌다 */
body.vnode .tl.ctr[data-lod="3"] .cd .ic svg g{filter:brightness(1.35)}
body.vnode .tl.ctr[data-lod="3"] .bgs{fill:#131315!important}
body.vnode .tl.ctr[data-lod="3"] .nl{font-size:14px;font-weight:700;color:#fff;padding:5px 12px 6px;border-radius:10px;background:rgba(8,8,10,.92)}
.tl.flash .cd::before{display:block!important;content:'';position:absolute;inset:-3px;border-radius:inherit;pointer-events:none;animation:flr .65s ease-out 1}
@keyframes flr{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75),0 0 0 0 rgba(255,255,255,.5);opacity:1}70%{box-shadow:0 0 0 14px rgba(255,255,255,0),0 0 46px 10px rgba(255,255,255,.28);opacity:1}100%{box-shadow:0 0 0 18px rgba(255,255,255,0),0 0 50px 12px rgba(255,255,255,0);opacity:0}}
.tl.ux .cd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 12px 26px -16px rgba(255,255,255,.4)!important;background:#2e2e32!important}


/* 카드 — 레퍼런스 스타일: 짙은 회색 면 + 안쪽 패널 + 작은 컬러 점 */
.tl{contain:layout style;position:absolute;left:0;top:0;width:330px;height:196px;transform-origin:50% 50%;will-change:transform;cursor:pointer;display:grid;place-items:center}
.tl.new .in{animation:tin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes tin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.tl.quick .in{animation:qin .3s ease both}
@keyframes qin{from{opacity:0}to{opacity:1}}
.tl .in{position:relative;display:grid;place-items:center;width:100%;height:100%}
.cd{position:relative;border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.42);transition:transform .22s ease,background .22s,box-shadow .22s}
.cd::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.11),transparent 55%);pointer-events:none}
.tl:hover .cd{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.1),0 20px 44px -18px var(--glow,rgba(255,255,255,.25))}
.tl:hover .cd{transform:translateY(-3px)}
.cd .hd{display:flex;align-items:center;gap:9px}
.cd .ic{display:grid;place-items:center;width:22px;height:22px;flex:none}
.cd .ic svg{width:22px;height:22px;display:block}
.cd .t{font-weight:500;color:#f1f1f1;line-height:1.3;word-break:keep-all;letter-spacing:-.2px}
.cd .pn{margin-top:12px;border-radius:15px;background:rgba(0,0,0,.30);padding:10px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.cd .pl{margin-top:10px;border-radius:12px;background:rgba(0,0,0,.38);padding:10px 13px;font-size:12.5px;color:#cdcdcd;display:flex;justify-content:space-between;align-items:center}
.cd .pl em{font-style:normal;color:#7b7b7b;font-size:11px}
.cd .sb{margin:9px 0 0 31px;font-size:12.5px;color:#8f8f8f}
.cd .mc{display:inline-flex;margin:10px 0 0 19px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d8d8d8;font-size:11.5px;font-weight:500}

.cd.R .t{font-size:21px;font-weight:600}
.cd.L .t{font-size:17px;font-weight:600}
.cd.M .t{font-size:14.5px}
/* 카드 등급별 배경(크기와 안쪽 여백은 내용에 맞춰 코드에서 계산) */
.cd{display:flex;flex-direction:column;justify-content:center}
.cd.R{background:linear-gradient(180deg,rgba(72,72,78,.82),rgba(40,40,46,.78))}
.cd.L{background:linear-gradient(180deg,rgba(62,62,68,.8),rgba(38,38,44,.76))}
.cd.M{background:rgba(46,46,52,.78)}
.cd.S{background:rgba(36,36,42,.76);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 10px 22px rgba(0,0,0,.4)}
.cd.E{background:linear-gradient(180deg,rgba(92,92,100,.9),rgba(56,56,64,.86));animation:expo .35s cubic-bezier(.2,.9,.3,1.2) both;justify-content:flex-start}
.cd.R .t{font-size:21px;font-weight:600}.cd.L .t{font-size:17px;font-weight:600}.cd.M .t{font-size:14.5px}
.cd.S .t{font-size:13.5px;color:#cfcfcf}
.cd.S:not(.E) .hd{min-width:0;width:100%}
.cd.S:not(.E) .t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .sb{margin:9px 0 0 31px;font-size:12.5px;line-height:17.5px;color:#8f8f8f}
.cd .mc{display:inline-flex;align-self:flex-start;align-items:center;height:22px;margin:10px 0 0 31px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d8d8d8;font-size:11.5px;font-weight:500}

/* 거리에 따른 정보 단계: 0 전부 · 1 설명 숨김 · 2 제목 흐림 · 3 아이콘만 */
.cd .t,.cd .sb,.cd .mc{transition:opacity .3s}
.cd{transition:width .46s cubic-bezier(.22,.9,.3,1),height .46s cubic-bezier(.22,.9,.3,1),padding .46s cubic-bezier(.22,.9,.3,1),transform .22s ease,background .22s,box-shadow .22s}
.cd .t,.cd .sb,.cd .mc{transition:opacity .4s ease .24s}   /* 카드가 거의 펼쳐진 뒤에 내용이 부드럽게 나타난다 */
.tl[data-lod="1"] .sb,.tl[data-lod="1"] .mc,.tl[data-lod="2"] .sb,.tl[data-lod="2"] .mc{display:none}
.tl[data-lod="2"] .t{opacity:.45}
.tl[data-lod="3"] .t,.tl[data-lod="3"] .sb,.tl[data-lod="3"] .mc{opacity:0;transition:opacity .14s ease 0s;pointer-events:none}   /* 숨길 때도 display:none으로 툭 사라지지 않고 빠르게 흐려진다 */
.tl[data-lod="3"] .cd{padding:0 0 0 15px!important;justify-content:center}   /* 아이콘 자리를 카드 상태와 거의 같게 둬서 펼칠 때 아이콘이 튀지 않는다 */
body.vnode .tl[data-lod="3"] .cd{padding:0!important}
body.vnode .tl:hover .cd{transform:none!important}   /* 노드형은 호버해도 아이콘이 위로 뜨지 않게 — 선이 닿는 자리와 어긋나 보이지 않는다 */
body.vnode .tl[data-lod="3"] .t,body.vnode .tl[data-lod="3"] .sb,body.vnode .tl[data-lod="3"] .mc,body.vnode .tl[data-lod="3"] .cd .gl,body.vnode .tl[data-lod="3"] .cd .rg{display:none!important}
body.vnode .tl[data-lod="3"] .cd .hd{justify-content:center;width:100%}
.tl.dim .in{opacity:.2!important}
/* 더보기: 다른 노드에 호버할 때도 죽어 보이지 않게, 눌러볼 수 있는 자리임을 알려준다 */
.tl.X.dim .in{opacity:.72!important}
.tl.X .cd{cursor:pointer}
.tl.X:hover .in{opacity:1!important}
.tl.X:hover .cd{background:#303034!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.45)!important;transform:translateY(-2px)}
.tl.X:hover .cd em{color:#fff}
/* 선택한 카드 — 안쪽 패널에 도메인 행(누르면 펼침/접힘) */
@keyframes expo{from{transform:scale(.93);opacity:.85}to{transform:none;opacity:1}}
.cd.E .pn{margin-top:12px;padding:6px 8px}
.cd .rw{display:flex;justify-content:flex-end;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;border-radius:9px;font-size:13px;color:#a2a2a8;text-align:right;transition:background .15s,color .15s}
.cd .rw>span{margin-right:auto}
.cd .rw b{color:#e8e8ea;font-weight:600;font-variant-numeric:tabular-nums}
.cd .rw i{width:9px;height:9px;border-radius:50%;flex:none;transition:box-shadow .2s}
.cd .rw:hover{background:rgba(255,255,255,.07);color:#fff}
.cd .rw.on{color:#fff}
.cd .rw em.st{font-style:normal;font-size:11px;color:#8c8c92;position:relative}

.cd .rw.on em.st{color:#cfcfd4}

.cd .rw.on{background:transparent}
.cd .rw.on em{color:#cfcfd4}

/* 외곽선이 아래로 갈수록 빛 색으로 물들고, 카드 안쪽 하단에서 은은하게 번지는 빛 */
.cd .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(125% 78% at 50% 114%,color-mix(in srgb,var(--glow2,#fff) 44%,transparent),color-mix(in srgb,var(--glow2,#fff) 13%,transparent) 44%,transparent 72%)}
.cd .rg{position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .35s;background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.14) 46%,color-mix(in srgb,var(--glow2,#fff) 88%,transparent) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tl:hover .cd .gl{opacity:.5}.tl:hover .cd .rg{opacity:.65}
.tl.sel .cd .gl{opacity:1}.tl.sel .cd .rg{opacity:1}
.cd.R .gl{opacity:.32;--glow2:#fff}.cd.R .rg{opacity:.55;--glow2:#fff}
.cd.X .gl,.cd.X .rg{display:none}

.tl.sel .cd{background:linear-gradient(180deg,rgba(92,92,100,.9),rgba(56,56,64,.86));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.34),0 24px 56px -22px var(--glow,rgba(255,255,255,.4))}
.tl:hover .tl.sel .cd{--rim:rgba(255,255,255,.1)}
.tl .ft{position:absolute;left:50%;top:calc(100% - 8px);transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(30,30,34,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.6);z-index:5;white-space:nowrap}
.ft button{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:999px;font-size:12px;font-weight:500;color:#bdbdbd}
.ft button i{width:8px;height:8px;border-radius:50%}
.ft button em{font-style:normal;color:#808080}
.ft button:hover{background:rgba(255,255,255,.08);color:#fff}
.ft button.on{background:#f1f1f1;color:#0b0b0d}.ft button.on em{color:#55555d}

/* 공통 UI */
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(10,10,12,.82);box-shadow:inset 0 0 0 1px var(--bd);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill.cur{color:#fff}.pill:hover{color:#fff}
.cir{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(10,10,12,.82);box-shadow:inset 0 0 0 1px var(--bd);color:var(--ink2);flex:none}
.cir:hover{color:#fff}
.cir svg,.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:18px;right:18px;top:16px;display:flex;align-items:center;gap:8px;z-index:6;pointer-events:none}
.top>*{pointer-events:auto}
.logo{width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:19px;margin-right:2px}
.crumb{display:flex;gap:4px;align-items:center;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bd);background:rgba(10,10,12,.6)}
.crumb .pill{box-shadow:none;background:transparent;backdrop-filter:none}
.crumb .pill.cur{box-shadow:inset 0 0 0 1px var(--bd2);background:rgba(255,255,255,.05)}
.rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(10,10,12,.82);box-shadow:inset 0 0 0 1px var(--bd)}
.seg button{padding:0 12px;height:28px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button.on{background:#fff;color:#0b0b0d}
.avt{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#27d3ff);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
#recent{position:absolute;left:18px;top:60px;display:flex;gap:6px;flex-wrap:wrap;max-width:520px;z-index:5}
.rchip{display:flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 10px;border-radius:999px;font-size:11.5px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--bd);background:rgba(10,10,12,.82);cursor:pointer}
.rchip i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:var(--ink3);font-style:normal;font-size:12px}
.rchip i:hover{background:rgba(255,255,255,.14);color:#fff}

/* 하단 중앙 — 도메인 필터 */
.nav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(40,40,44,.9);z-index:6}
.nav button{display:flex;align-items:center;gap:8px;height:38px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:#c8c8cf}
.nav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:#fff;color:#0b0b0d}
.nav button:not(.on){opacity:.75}
.bl{position:absolute;left:18px;bottom:22px;display:flex;gap:8px;z-index:6}
.br{position:absolute;right:18px;bottom:22px;display:flex;align-items:center;gap:8px;z-index:6}
.zm{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px;border-radius:999px;background:rgba(10,10,12,.82);box-shadow:inset 0 0 0 1px var(--bd);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.zm button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.zm button:hover{color:#fff;background:rgba(255,255,255,.08)}
.zm button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.spb{position:absolute;left:18px;top:60px;width:300px;display:none;z-index:7}
.spb.on{display:block}
.sbox{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-radius:999px}
.sbox svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;flex:none}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:14px}
.glass{background:#0c0c0e;box-shadow:inset 0 0 0 1px var(--bd2),0 14px 40px rgba(0,0,0,.6);border-radius:18px}
.banner{position:absolute;top:62px;left:50%;transform:translate(-50%,-8px);padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:8;border-radius:999px;background:#fff;color:#0b0b0d;font-weight:600}
.banner.on{opacity:1;transform:translate(-50%,0)}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:var(--ink2);flex:none}
.ib:hover{background:rgba(255,255,255,.08);color:#fff}
/* 라이트패널 */
.lp{position:absolute;right:16px;top:70px;bottom:16px;width:352px;display:flex;flex-direction:column;overflow:hidden;border-radius:26px;transform:translateX(24px);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1);z-index:4}
.lp.on{transform:none;opacity:1;pointer-events:auto}
.lp .head{padding:16px 16px 16px;position:relative}
.lp .head::before{display:none}
.lp .hrow{position:relative;display:flex;gap:12px;align-items:flex-start}
.lp .ico{width:46px;height:46px;display:grid;place-items:center;flex:none}
.lp .ico svg{width:100%;height:100%}
.lp h2{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.3px;word-break:keep-all}
.lp .sub{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;align-items:center}
.lp .x{margin-top:-4px;margin-right:-6px}
.hrt svg{width:19px;height:19px;stroke:var(--ink2);fill:none;stroke-width:1.8}
.hrt.on svg{fill:#ff5b7a;stroke:#ff5b7a}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:16px;background:var(--card)}
.stats b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.stats span{font-size:11px;color:var(--ink3);line-height:1.25}
.prog{position:relative;margin-top:10px;padding:14px;border-radius:16px;background:var(--card)}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:9px}
.prog .t b{color:#fff;font-weight:600}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--skill)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.75);border-radius:1px}
.cta-btn{position:relative;margin-top:14px;width:100%;height:54px;border-radius:16px;background:#3182f6;color:#fff;font-weight:700;font-size:16px}
.cta-btn:hover{background:#4593fc}
.seg2{display:flex;margin:0 14px;padding:4px;border-radius:14px;background:var(--card)}
.seg2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:11px;font-size:13px;color:var(--ink3);font-weight:600}
.seg2 button.on{background:#3a3f49;color:#fff}
.list{flex:1;overflow:auto;padding:8px 8px 14px;margin-top:6px}
.li{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:13px;cursor:pointer}
.li:hover{background:rgba(255,255,255,.06)}
.li .th{width:38px;height:38px;display:grid;place-items:center;flex:none}
.li .th svg{width:100%;height:100%}
.li .tx{flex:1;min-width:0}
.li .nm{font-size:13.5px;font-weight:600;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .meta{font-size:11.5px;color:var(--ink3);margin-top:2px;display:flex;gap:6px;align-items:center}
.badge{padding:1px 7px;border-radius:5px;background:rgba(245,184,61,.16);color:#f8cf75;font-size:10.5px;font-weight:700}
.li .more{padding:7px 12px;border-radius:10px;background:var(--card);font-size:12px;font-weight:600;color:var(--ink2);flex:none}
.li .more:hover{background:rgba(255,255,255,.16);color:#fff}
.empty{padding:36px 12px;text-align:center;color:var(--ink2);font-size:13px}
.moreb{width:calc(100% - 16px);margin:6px 8px 0;height:38px;border-radius:11px;background:rgba(255,255,255,.06);font-size:13px;color:var(--ink2);font-weight:600}

.scrim{position:absolute;inset:0;background:rgba(3,4,8,.62);display:none;place-items:center;z-index:20}
.scrim.on{display:grid}
.modal{width:min(340px,calc(100% - 40px));padding:24px 20px 16px;background:#1b1e25;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h4{font-size:17px;font-weight:700;line-height:1.45;word-break:keep-all}
.modal p{font-size:13px;color:var(--ink2);margin-top:6px}
.modal .row{display:flex;gap:8px;margin-top:18px}
.modal .row button{flex:1;height:50px;border-radius:15px;font-weight:700;font-size:15px;background:var(--card)}
.modal .row button.p{background:#3182f6;color:#fff}
.course{display:flex;align-items:center;gap:10px;padding:12px;margin-top:8px;border-radius:13px;background:rgba(255,255,255,.05)}
.course .n{flex:1;font-size:13.5px;font-weight:600;word-break:keep-all}
.course small{display:block;color:var(--ink3);font-weight:500;margin-top:2px;font-size:11.5px}
.course button{padding:9px 14px;border-radius:11px;background:#3182f6;color:#fff;font-size:12.5px;font-weight:700;flex:none}
.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);padding:11px 18px;border-radius:999px;background:#fff;color:#0b0c10;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.sug{position:absolute;left:0;right:0;top:48px;padding:8px;max-height:60vh;overflow:auto;display:none;border-radius:18px}
.sug.on{display:block}
.sug h6{font-size:11px;color:var(--ink3);font-weight:600;padding:8px 8px 4px;display:flex;justify-content:space-between}
.sug button{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:10px;text-align:left;font-size:13.5px}
.sug button:hover{background:rgba(255,255,255,.07)}
.sug .none{padding:14px 8px;color:var(--ink2);font-size:13px}
.chipsrow{display:flex;gap:6px;flex-wrap:wrap;padding:6px 4px 2px}
.chipsrow button{padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12.5px;color:var(--ink2)}
.chipsrow button:hover{background:rgba(255,255,255,.13);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-skill{background:var(--skill)}.d-content{background:var(--content)}.d-career{background:var(--career)}

.lp h2{font-size:19px}
/* 상세 패널 — 반투명 유리 + 위쪽 도메인 색 틴트 + 림 라이트 + 글로우 */
.lp{background:linear-gradient(180deg,rgba(74,66,92,.62) 0%,rgba(40,38,48,.72) 34%,rgba(26,26,30,.8) 100%)!important;-webkit-backdrop-filter:blur(16px) saturate(1.25)!important;backdrop-filter:blur(16px) saturate(1.25)!important;border:0!important;border-radius:26px;top:62px;bottom:84px;right:16px;width:348px;
  box-shadow:inset 0 1px 0 rgba(222,200,255,.5),inset 0 0 0 1px rgba(255,255,255,.07),0 28px 70px rgba(0,0,0,.6),0 0 90px -24px rgba(150,115,255,.5)}
.lp::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(180deg,rgba(214,190,255,.7) 0%,rgba(255,255,255,.12) 38%,rgba(255,255,255,.05) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lp .head{position:relative}
.lp .head::before{content:"";display:block;position:absolute;left:0;right:0;top:0;height:150px;border-radius:26px 26px 0 0;background:radial-gradient(120% 100% at 18% 0%,color-mix(in srgb,var(--tint,#fff) 34%,transparent),transparent 70%);pointer-events:none}
.lp .hrow,.lp .stats,.lp .prog,.lp .cta-btn{position:relative}
.stats div,.prog{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.08)}
.seg2{background:rgba(0,0,0,.28);padding:4px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.seg2 button{height:36px;border-radius:12px}
.seg2 button.on{background:#fff;color:#0b0b0d;box-shadow:0 6px 18px -6px rgba(255,255,255,.5)}
.seg2 button.on .dot{box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.li:hover{background:rgba(255,255,255,.07)}
.li .more{background:rgba(255,255,255,.08)}
.cta-btn{background:#74e6a8;color:#08281a;border-radius:999px;height:50px;font-weight:700;box-shadow:0 10px 28px -10px rgba(116,230,168,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.cta-btn:hover{background:#8df0b9}
/* 상세 패널 — 레퍼런스(Node Settings)처럼 거의 흑백: 색은 아주 작은 점에만 */
.lp{background:linear-gradient(180deg,rgba(46,46,50,.8),rgba(26,26,29,.88))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06),0 28px 70px rgba(0,0,0,.6)!important}
.lp::before{background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.07) 40%,rgba(255,255,255,.04) 100%)!important}
.lp .head::before{display:none!important}
.stats div,.prog{background:rgba(255,255,255,.045)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)!important}
.seg2{background:rgba(0,0,0,.3)!important}
.seg2 button.on{background:rgba(255,255,255,.13)!important;color:#fff!important;box-shadow:none!important}
.seg2 .dot{background:#8e8e95!important}
.seg2 button.on .dot{background:#fff!important;box-shadow:none!important}
.lp .bar i{background:#e8e8ea!important}
.lp .bar u{background:rgba(255,255,255,.55)!important}
.cta-btn{background:#fff!important;color:#0b0b0d!important;box-shadow:none!important}
.cta-btn:hover{background:#e9e9ec!important}
.course button{background:#fff!important;color:#0b0b0d!important}
.lp .th svg,.lp .ico svg{filter:grayscale(1) brightness(1.25)}
.badge{background:rgba(255,255,255,.1)!important;color:#d0d0d6!important}
.hrt.on svg{fill:#ececee!important;stroke:#ececee!important}
.li:hover{background:rgba(255,255,255,.06)!important}
.li .more{background:rgba(255,255,255,.07)!important}
/* 글래스 느낌 줄이기 — 불투명한 평평한 면 + 얇은 테두리 */
.cd::before{display:none!important}
.cd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.085),0 10px 26px rgba(0,0,0,.4)!important}
.cd.R{background:#46464a!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 10px 26px rgba(0,0,0,.4)!important}.cd.R .sb{color:#b9b9bf}.cd.R .mc{background:rgba(255,255,255,.16);color:#ececef}.cd.L{background:#252527!important}.cd.M{background:#212123!important}.cd.S{background:#1c1c1e!important}.cd.X{background:#1c1c1e!important}
.cd.E{background:#2f2f32!important}
.cd .pn{background:#18181a!important;box-shadow:none!important}
.cd .pl{background:#141416!important}
.tl:hover .cd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.17),0 12px 28px rgba(0,0,0,.45)!important}
.tl.sel .cd{background:#303033!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 22px 50px -26px var(--glow,rgba(255,255,255,.4))!important}
.lp{background:#1c1c1e!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.55)!important}
.lp::before{display:none!important}
.stats div,.prog{background:#262628!important;box-shadow:none!important}
.seg2{background:#141416!important}
.seg2 button.on{background:#323235!important}
.li:hover{background:rgba(255,255,255,.05)!important}
.li .more{background:#272729!important}
.pill,.cir,.seg,.zm,.rchip,.lg{background:#1a1a1c!important}
.crumb{background:#161617!important}
.nav{background:#202023!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.5)!important}
/* 하단 도메인 필터 — 켜짐은 한 톤 밝은 면 + 도메인 색 아이콘, 꺼짐은 회색 */
.nav{padding:4px!important;gap:2px!important;background:#151517!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.5)!important}
.nav button{height:34px!important;padding:0 14px 0 12px!important;gap:7px!important;font-size:13px!important;font-weight:600!important;color:#6f6f77!important;background:transparent!important;opacity:1!important;border-radius:999px;transition:background .2s,color .2s}
.nav button svg{width:15px!important;height:15px!important;color:#5d5d64;transition:color .2s}
.nav button em{font-style:normal;font-size:11.5px;font-weight:500;color:#5f5f66;margin-left:1px;font-variant-numeric:tabular-nums}
.nav button:hover{color:#c9c9ce!important}
.nav button.on{background:#2a2a2d!important;color:#f1f1f3!important}
.nav button.on svg{color:var(--c)}
.nav button.on em{color:#9b9ba3}
.modal{background:#121214;box-shadow:inset 0 0 0 1px var(--bd2),0 24px 70px rgba(0,0,0,.7)}
.modal .row button{background:#1b1b1f}.modal .row button.p{background:#fff;color:#0b0b0d}
.course button{background:#74e6a8;color:#08281a}
.toast{bottom:84px;z-index:30}
.nav{box-shadow:0 10px 40px -8px rgba(150,120,255,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.scrim{z-index:40}
.sug{background:#0c0c0e}

/* ═════ 모바일(≤760px) ═════ */
@media (max-width:760px){
  .top{left:12px!important;right:12px!important;top:calc(env(safe-area-inset-top,0px) + 12px)!important;gap:6px!important}
  .top .logo,.top #bRoot,.top .avt{display:none!important}
  .top .crumb{max-width:150px;overflow:hidden}.top .crumb *{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .seg button{white-space:nowrap;font-size:12px!important;padding:0 10px!important}
  .rt{gap:6px!important}
  .nav{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)!important;max-width:calc(100% - 24px);white-space:nowrap}

const mixDark=(hex,a)=>{const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,B=[26,26,30];return '#'+[r,g,b].map((v,i)=>Math.round(B[i]*(1-a)+v*a).toString(16).padStart(2,'0')).join('')};
function badgeIco(t){

function floatOff(id){if(isMore(id)||dragging)return {x:0,y:0};const A=2.5*(szS(id)+.2)*(1+depthF(id)*2);return {x:S.sx*A,y:S.sy*A}}

  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;tgt.z=Math.max(.3,Math.min(2.2,pinch.z*d/pinch.d));vel.x=vel.y=0;dragged=true;kick()}});
const _pe=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};addEventListener('pointerup',_pe);addEventListener('pointercancel',_pe);
stage.addEventListener('pointerdown',e=>{if(pinch)return;if(e.target.closest('.ft')||e.target.closest('.nav'))return;pan={x:e.clientX,y:e.clientY,tx:tgt.x,ty:tgt.y,lx:e.clientX,ly:e.clientY,moved:false,onTile:!!e.target.closest('.tl')};dragged=false;vel.x=vel.y=0});
addEventListener('pointermove',e=>{if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(!pan.moved&&Math.hypot(dx,dy)<6)return;
  pan.moved=true;dragged=true;dragging=true;stage.classList.add('drag');
  const stepx=-(e.clientX-pan.lx)/cam.z,stepy=-(e.clientY-pan.ly)/cam.z;vel.x=vel.x*.5+stepx*.5;vel.y=vel.y*.5+stepy*.5;pan.lx=e.clientX;pan.ly=e.clientY;
  tgt.x=pan.tx-dx/cam.z;tgt.y=pan.ty-dy/cam.z;kick()});
addEventListener('pointerup',e=>{if(!pan)return;const p=pan;pan=null;dragging=false;stage.classList.remove('drag');
  if(p.moved){setTimeout(()=>dragged=false,0);kick();return}
  if(!p.onTile&&!isFrozen()&&!e.target.closest('.ft')&&!e.target.closest('.nav')){S.sel=null;S.spot=null;closePanel();render()}});
/* 곡면 투영의 역: 화면에서 초점 중심으로부터의 거리 → 곡면 적용 전 거리 */
function invDelta(ox,oy,A_){let dx=ox,dy=oy;const R=Math.hypot(W,H)*.52;for(let i=0;i<10;i++){const f=1+A_*((dx*dx+dy*dy)/(R*R));dx=ox*f;dy=oy*f}return {dx,dy}}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||dragging)return;const r=stageBox();S.mx=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2)));S.my=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)));kick()});
stage.addEventListener('pointerleave',()=>{S.mx=0;S.my=0;kick()});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stageBox();let ox=e.clientX-r.left-(W/2-fsh),oy=e.clientY-r.top-H/2;
  {let best=1e9,pfN=0;Object.keys(S.pos).forEach(id=>{if(isMore(id)||!visible(id))return;const w=wpos(id),p=proj(w.x,w.y,depthF(id));const d=Math.hypot(p.x-(e.clientX-r.left),p.y-(e.clientY-r.top));if(d<best){best=d;pfN=depthF(id)}});ox/=(1+pfN);oy/=(1+pfN)}
  // 지금(목표) 상태에서 커서 아래에 있는 세계 좌표
  const A0=depthK(tgt.z),q0=invDelta(ox,oy,A0);const wx=tgt.x+q0.dx/tgt.z,wy=tgt.y+q0.dy/tgt.z;
  const d=Math.max(-60,Math.min(60,e.deltaY));const nz=Math.max(.3,Math.min(2.2,tgt.z*Math.exp(-d*.0022)));
  // 새 줌에서도 같은 지점이 커서 아래에 오도록 카메라 목표를 옮긴다
  const q1=invDelta(ox,oy,depthK(nz));
  vel.x=vel.y=0;tgt.z=nz;tgt.x=wx-q1.dx/nz;tgt.y=wy-q1.dy/nz;kick();
},{passive:false});
$('#tiles').addEventListener('pointerover',e=>{const t=e.target.closest('.tl');if(t&&!dragging&&!isMore(t.dataset.id))setHover(t.dataset.id)});
$('#tiles').addEventListener('pointerout',e=>{if(e.target.closest('.tl')&&!e.relatedTarget?.closest?.('.tl'))setHover(null)});
$('#tiles').addEventListener('click',e=>{if(dragged)return;const f=e.target.closest('[data-fan]'),t=e.target.closest('.tl');if(!t)return;
  if(isMore(t.dataset.id)){showMore(t.dataset.id);return}if(f){expandDom(t.dataset.id,f.dataset.fan);return}select(t.dataset.id)});
$('#zIn').onclick=()=>{tgt.z=Math.min(2.2,tgt.z*1.25);kick()};$('#zOut').onclick=()=>{tgt.z=Math.max(.3,tgt.z/1.25);kick()};
$('#bFit').onclick=()=>fit(true);$('#bCenter').onclick=()=>focusNode(S.center,true);
function rootReset(){build(S.root);closePanel();render();fitNow();banner('처음 중심으로 돌아왔어요')}
$('#bRoot').onclick=rootReset;
$('#bBack').onclick=()=>{if(S.hist.length){const p=S.hist.pop();build(p);closePanel();render();fitNow()}else banner('이전 중심이 없어요')};
$('#bSearch').onclick=()=>{const sp=$('#sp');sp.classList.toggle('on');if(sp.classList.contains('on')){$('#q').focus();sugRender()}else $('#sug').classList.remove('on')};
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(document.getElementById('stage'));

/* ═════════ 라이트패널 ═════════ */
const mobile=()=>innerWidth<=760;
const fmt=v=>Number.isInteger(+v.toFixed(1))?String(Math.round(v)):v.toFixed(1);
function select(id){
  const was=S.panel;S.sel=id;S.panel=true;if(S.spot&&S.spot.owner!==id&&!S.spot.ids.has(id))S.spot=null;pushPath(id);
  render();openPanel();
  focusNode(id,true);
}
function openPanel(){const lp=$('#lp');if(mobile()&&!lp.classList.contains('on'))lp.classList.add('snap1');lp.classList.add('on');document.body.classList.toggle('sheet',mobile());document.body.classList.toggle('pnl',!mobile())}
function closePanel(){S.panel=false;$('#lp').classList.remove('on','snap1','snap2');document.body.classList.remove('sheet','pnl')}
$('#grab').addEventListener('click',()=>{if(mobile())$('#lp').classList.toggle('snap2')});
function renderPanel(){
  const id=S.sel;if(!id)return;const n=N[id],c=COL[n.type];
  const mine=ME.pts[id];const my=S.login&&mine!=null;
  let stats='',prog='',cta='',sub='',heart='';
  if(n.type==='skill'){
    stats=`<div><b>${n.cnt.toLocaleString()}명</b><span>스킬 보유자</span></div><div><b>${relCount(id,'content')}개</b><span>연관 콘텐츠</span></div><div><b>${n.avg} pt</b><span>전체 평균 포인트</span></div>`;
    if(my){const top=n.avg*1.5,w=Math.min(100,mine/top*100),av=n.avg/top*100,diff=n.avg-mine;
      const msg=diff>0?`평균까지 <b>${fmt(diff)} pt</b> 남음`:diff===0?'<b>평균 달성</b>':`평균 <b>+${fmt(-diff)} pt</b>`;
      prog=`<div class="prog"><div class="t"><span>내 포인트 <b>${fmt(mine)} pt</b></span><span>${msg}</span></div><div class="bar"><i style="width:${w}%"></i><u style="left:${av}%"></u></div></div>`}
    cta='스킬 상세 보기';
    heart=`<button class="ib hrt ${S.liked.has(id)?'on':''}" id="heart" title="관심 스킬"><svg viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-9.300-9.300C1.500 7.400 3.600 4.500 6.700 4.500c2 0 3.500 1.100 5.300 3 1.800-1.900 3.300-3 5.300-3 3.100 0 5.200 2.900 4 6.200C19.500 15.400 12 20 12 20z"/></svg></button>`;
  }else if(n.type==='career'){
    stats=`<div><b>${n.cnt.toLocaleString()}명</b><span>커리어 보유자</span></div><div><b>${relCount(id,'skill')}개</b><span>연관 스킬</span></div><div><b>${relCount(id,'content')}개</b><span>연관 콘텐츠</span></div>`;
    cta='커리어 상세 보기';if(S.login&&id===ME.myCareer)sub='<span class="myc">마이커리어</span>';
  }else{
    cta=!S.login?'학습하기':n.prod==='course'?'구매하기':n.prod==='member'?'멤버십 가입하기':'학습하기';
    if(S.login&&n.prod==='owned'){prog=`<div class="prog"><div class="t"><span>학습 진행률</span><span><b>35%</b></span></div><div class="bar"><i style="width:35%;background:var(--content)"></i></div></div>`;cta='이어 학습하기'}
    if(n.prod==='multi')sub='<span>2개 과정에 들어 있어요</span>';
  }
  const head=$('#lpHead');head.style.setProperty('--tint',c);
  head.innerHTML=`<div class="hrow"><div class="ico">${tileHTML(n.type,46)}</div><div style="flex:1;min-width:0"><h2>${esc(n.name)}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div>${heart}<button class="ib x" id="px" title="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>${stats?`<div class="stats">${stats}</div>`:''}${prog}<button class="cta-btn" id="ctaBtn">${cta}</button>`;
  $('#px').onclick=closePanel;
  const hr=head.querySelector('.hrow');hr.onmouseenter=()=>setHover(id);hr.onmouseleave=()=>setHover(null);
  const h=$('#heart');if(h)h.onclick=()=>{if(!S.login){toast('로그인하면 관심 스킬로 저장해요');return}
    if(S.liked.has(id)){S.liked.delete(id);toast('관심 스킬에서 뺐어요')}else{S.liked.add(id);toast('관심 스킬에 추가했어요')}renderPanel()};
  $('#ctaBtn').onclick=()=>ctaGo(id);
  const doms=['content','career','skill'];
  $('#tabs').innerHTML=doms.map(d=>`<button data-d="${d}" class="${S.tab===d?'on':''}"><span class="dot d-${d}"></span>${T[d]}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.d;renderPanel()});
  renderList();
}
function renderList(){
  const id=S.sel,d=S.tab;const all=relTo(id,d);const el=$('#list');
  if(!all.length){el.innerHTML=`<div class="empty">연관 ${T[d]}이 아직 없어요</div>`;return}
  const key=id+d;const more=S.showAll[key];const rows=more?all:all.slice(0,20);
  el.innerHTML=rows.map(([i])=>{const n=N[i];let meta='';
    if(n.type==='skill'){meta=`스킬 보유자 ${n.cnt.toLocaleString()}명`+(S.login&&ME.pts[i]!=null?' <span class="badge">내 스킬</span>':'')}
    else if(n.type==='career'){meta=`커리어 보유자 ${n.cnt.toLocaleString()}명`+(N[id].type==='skill'?` · 평균 ${Math.round(n.cnt/80)} pt`:'')}
    else{meta=n.prod==='multi'?'2개 과정에 들어 있어요':n.ct||'콘텐츠'}
    return `<div class="li" data-i="${i}"><div class="th">${tileHTML(n.type,38)}</div><div class="tx"><div class="nm">${esc(n.name)}</div><div class="meta">${meta}</div></div><button class="more" data-more="${i}">상세</button></div>`}).join('')
    +(!more&&all.length>20?`<button class="moreb" id="moreb">더보기 (${all.length-20})</button>`:'');
  el.querySelectorAll('.li').forEach(li=>{
    li.onmouseenter=()=>setHover(li.dataset.i);li.onmouseleave=()=>setHover(null);
    li.onclick=e=>{if(e.target.dataset.more)return;recenter(li.dataset.i)};
  });
  el.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();detail(b.dataset.more)});
  const mb=$('#moreb');if(mb)mb.onclick=()=>{S.showAll[key]=1;renderList()};
}
function recenter(id){S.hist.push(S.center);S.hover=null;build(id);S.fresh=new Set(Object.keys(S.pos));S.sel=id;S.panel=true;render();fit(false);renderPanel();burst();banner(`${N[id].name} 중심으로 다시 열었어요`)}

function confirmM(title,sub,ok,fn){
  $('#modal').innerHTML=`<h4>${title}</h4>${sub?`<p>${sub}</p>`:''}<div class="row"><button id="mNo">닫기</button><button class="p" id="mOk">${ok}</button></div>`;
  $('#scrim').classList.add('on');$('#mNo').onclick=closeModal;$('#mOk').onclick=()=>{closeModal();fn()};
}
function closeModal(){$('#scrim').classList.remove('on')}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
function ctaGo(id){
  const n=N[id];
  if(n.type==='skill')return confirmM('이 스킬 상세로 이동할까요?','','이동',()=>toast('스킬 상세로 이동해요 (시안)'));
  if(n.type==='career')return confirmM('이 커리어 상세로 이동할까요?','','이동',()=>toast('커리어 상세로 이동해요 (시안)'));
  if(n.prod==='multi')return courseLayer(id);
  confirmM(`'${esc(n.name)}' 학습을 진행할까요?`,'','확인',()=>toast('학습 화면으로 이동해요 (시안)'));
}
function detail(id){
  const n=N[id];
  if(n.type==='content'){if(n.prod==='multi')return courseLayer(id);toast('콘텐츠 상세로 이동해요 (시안)');return}
  confirmM(n.type==='skill'?'이 스킬 상세로 이동할까요?':'이 커리어 상세로 이동할까요?','','이동',()=>toast('상세로 이동해요 (시안)'));
}
function courseLayer(id){
  const n=N[id];
  $('#modal').innerHTML=`<h4>${esc(n.name)}</h4><p>어느 과정으로 학습할까요?</p>`+n.courses.map(c=>`<div class="course"><div class="n">${c[0]}<small>학습 ${c[1].toLocaleString()}</small></div><button>${S.login?'구매하기':'학습하기'}</button></div>`).join('')+`<div class="row"><button id="mNo">닫기</button></div>`;
  $('#scrim').classList.add('on');$('#mNo').onclick=closeModal;
  $('#modal').querySelectorAll('.course button').forEach(b=>b.onclick=()=>{closeModal();toast('과정 상세로 이동해요 (시안)')});
}

/* 검색 */
const q=$('#q'),sug=$('#sug');
function sugRender(){
  const v=q.value.trim().toLowerCase();$('#qx').style.display=v?'grid':'none';sug.classList.add('on');
  if(!v){sug.innerHTML=`<h6>추천 검색어</h6><div class="chipsrow">${REC.map(r=>`<button data-r="${r}">${r}</button>`).join('')}</div>`;
    sug.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{q.value=b.dataset.r;sugRender()});return}
  let html='',any=false;
  ['skill','content','career'].forEach(d=>{const m=IDS.filter(i=>N[i].type===d&&(N[i].name.toLowerCase().includes(v)||N[i].tags.includes(v)));
    if(!m.length)return;any=true;
    html+=`<h6><span>${T[d]}</span>${m.length>5?`<span>${m.length}+</span>`:''}</h6>`+m.slice(0,5).map(i=>`<button data-i="${i}"><span class="dot d-${d}"></span><span>${esc(N[i].name)}</span></button>`).join('')});
  sug.innerHTML=any?html:'<div class="none">검색 결과가 없어요.</div>';
  sug.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;sug.classList.remove('on');q.value='';$('#qx').style.display='none';
    S.root=i;build(i);S.sel=i;S.panel=true;S.tab=N[i].type==='skill'?'content':'skill';render();fit(false);renderPanel();openPanel();burst();banner(`${N[i].name} 중심으로 열었어요`)});
}
q.addEventListener('focus',sugRender);q.addEventListener('input',sugRender);
$('#qx').onclick=()=>{q.value='';sugRender();q.focus()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.spb')&&!e.target.closest('#bSearch'))sug.classList.remove('on')});

function start(){
  S.login=document.querySelector('#seg .on').dataset.v==='in';
  S.root=S.login?ME.myCareer:FREQ.out[Math.floor(Math.random()*3)];
  S.hist=[];build(S.root);S.fresh=new Set(Object.keys(S.pos));closePanel();resize();render();fitNow();
}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));start()});
addEventListener('keydown',e=>{if(document.body.classList.contains('lock'))return;if(e.key==='Escape'&&!$('#scrim').classList.contains('on')){closePanel();S.sel=null;S.spot=null;render()}});
const _lg=$('#lgc');try{if(localStorage.getItem('hg_lgc')==='0'){_lg.classList.add('closed');$('#lgHead').setAttribute('aria-expanded','false')}}catch(e){}
function syncZw(){const z=document.querySelector('.br .zm');if(z&&z.offsetWidth)_lg.style.setProperty('--zw',z.offsetWidth+'px')}
syncZw();addEventListener('resize',syncZw);
$('#lgHead').addEventListener('click',()=>{const c=_lg.classList.toggle('closed');$('#lgHead').setAttribute('aria-expanded',String(!c));try{localStorage.setItem('hg_lgc',c?'0':'1')}catch(e){}});
function syncView(){document.body.classList.toggle('vnode',S.view==='node');document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view))}
syncView();
$('#vseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.v===S.view)return;S.view=b.dataset.v;try{localStorage.setItem('hg_view',S.view)}catch(x){}syncView();Object.keys(S.lodMap).forEach(k=>delete S.lodMap[k]);S.intro=null;document.body.classList.remove('intro');render();kick()});
const _bl=$('#bLines');
function syncLines(){_bl.classList.toggle('off',!S.lines);_bl.classList.toggle('on',S.lines);_bl.title=S.lines?'연결선 숨기기':'연결선 보기'}
syncLines();
_bl.addEventListener('click',()=>{S.lines=!S.lines;try{localStorage.setItem('hg_lines',S.lines?'1':'0')}catch(e){}syncLines();banner(S.lines?'연결선을 보여줘요':'연결선을 숨겼어요');kick()});
start();
</script>
